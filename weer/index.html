<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>CSE Weer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent; /* pas aan naar bv. #000000 als je scherm geen transparantie ondersteunt */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #weer {
    display: flex;
    align-items: center;
    gap: 0.5em;
    color: #0fb6ff;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 700;
  }
  #weer-icoon {
    font-size: 8vw;
    line-height: 1;
  }
  #weer-temp {
    font-size: 6vw;
  }
</style>
</head>
<body>
  <div id="weer">
    <span id="weer-icoon">--</span>
    <span id="weer-temp">--°C</span>
  </div>
  <script>
    // Weer ophalen voor Zwolle via Open-Meteo (gratis, geen API-key nodig)
    const WEERCODE_ICOON = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌦️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      71: '🌨️', 73: '🌨️', 75: '🌨️',
      80: '🌦️', 81: '🌧️', 82: '🌧️',
      95: '⛈️', 96: '⛈️', 99: '⛈️'
    };

    async function updateWeer() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.5168&longitude=6.0830&current_weather=true&timezone=Europe%2FAmsterdam');
        const data = await res.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;
        document.getElementById('weer-temp').textContent = temp + '°C';
        document.getElementById('weer-icoon').textContent = WEERCODE_ICOON[code] || '🌡️';
      } catch (e) {
        document.getElementById('weer-temp').textContent = '';
        document.getElementById('weer-icoon').textContent = '';
      }
    }
    updateWeer();
    setInterval(updateWeer, 10 * 60 * 1000); // elke 10 minuten verversen
  </script>
</body>
</html>
