<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>CSE Vertrektijden</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    #wrapper {
      width: 100%;
      height: 100%;
      padding: 2vh 3vw;
      box-sizing: border-box;
      display: flex;
      gap: 3vw;
    }

    .kolom {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .titel {
      color: #0fb6ff;
      font-size: 3.5vh;
      font-weight: 800;
      padding: 0.5vh 0;
      margin-bottom: 1vh;
      border-bottom: 3px solid #0fb6ff;
    }

    .tabel-container {
      flex: 1;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #000000;
    }

    th {
      text-align: left;
      font-weight: 700;
      color: #0fb6ff;
      border-bottom: 2px solid #0fb6ff;
      padding: 1vh 0.5vw;
    }

    td {
      padding: 1.2vh 0.5vw;
      border-bottom: 1px solid rgba(15, 182, 255, 0.25);
      font-weight: 600;
    }

    .vertraagd {
      color: #ff5050;
      font-weight: 800;
    }

    .buiten-dienst {
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div class="kolom">
      <div class="titel">🚆 Treinstation: Zwolle Centraal</div>
      <div class="tabel-container" id="container-trein">
        <table>
          <thead>
            <tr>
              <th>Tijd</th>
              <th>Bestemming</th>
              <th>Spoor</th>
            </tr>
          </thead>
          <tbody id="rijen-trein">
            <tr><td colspan="3">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="kolom">
      <div class="titel">🚌 Busstation: Stadionplein</div>
      <div class="tabel-container" id="container-bus">
        <table>
          <thead>
            <tr>
              <th>Tijd</th>
              <th>Lijn</th>
              <th>Bestemming</th>
            </tr>
          </thead>
          <tbody id="rijen-bus">
            <tr><td colspan="3">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const MAX = 7;

    function isBinnenBedrijfstijd() {
      const nu = new Date();
      const dag = nu.getDay(); // 1 = Ma, ..., 5 = Vr
      const uur = nu.getHours();
      return (dag >= 1 && dag <= 5) && (uur >= 8 && uur < 17);
    }

    // --- Treinen uit departures.json ---
    async function updateTrein() {
      const rijen = document.getElementById('rijen-trein');

      if (!isBinnenBedrijfstijd()) {
        rijen.innerHTML = '<tr><td colspan="3" class="buiten-dienst">Vertrektijden alleen beschikbaar op werkdagen van 08:00 tot 17:00</td></tr>';
        return;
      }

      try {
        const res = await fetch('./departures.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        const departures = (data.payload && data.payload.departures) || data.departures || data;
        rijen.innerHTML = '';

        if (!Array.isArray(departures) || departures.length === 0) {
          rijen.innerHTML = '<tr><td colspan="3">Geen actuele vertrektijden gevonden</td></tr>';
          return;
        }

        departures.slice(0, MAX).forEach(v => {
          const plannedStr = v.plannedDateTime || v.plannedDepartureTime;
          const actualStr = v.actualDateTime || v.actualDepartureTime;

          const tijd = new Date(actualStr || plannedStr);
          const tijdStr = tijd.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          const vertraagd = actualStr && actualStr !== plannedStr;

          const bestemming = v.direction || v.destination || '-';
          const spoor = v.actualTrack || (v.plannedTrackInfo && v.plannedTrackInfo.actualTrack) || v.plannedTrack || '-';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="${vertraagd ? 'vertraagd' : ''}">${tijdStr}</td>
            <td>${bestemming}</td>
            <td>${spoor}</td>
          `;
          rijen.appendChild(tr);
        });
      } catch (e) {
        rijen.innerHTML = '<tr><td colspan="3">Kan treintijden niet ophalen</td></tr>';
      }
      schaalTekstIn();
    }

    // --- Bussen uit buses.json ---
    function volgendeVertrekken(departures, aantal) {
      const nu = new Date();
      const nuStr = nu.toTimeString().slice(0, 8);
      const komend = departures.filter(d => d.departure_time >= nuStr);
      const bron = komend.length ? komend : departures;

      const gezien = new Set();
      const uniek = [];
      for (const d of bron) {
        const sleutel = d.departure_time + '|' + d.line + '|' + d.destination;
        if (!gezien.has(sleutel)) {
          gezien.add(sleutel);
          uniek.push(d);
        }
      }
      return uniek.slice(0, aantal);
    }

    async function updateBus() {
      const rijen = document.getElementById('rijen-bus');

      if (!isBinnenBedrijfstijd()) {
        rijen.innerHTML = '<tr><td colspan="3" class="buiten-dienst">Bustijden alleen beschikbaar op werkdagen van 08:00 tot 17:00</td></tr>';
        return;
      }

      try {
        const res = await fetch('./buses.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        rijen.innerHTML = '';

        const eerstvolgende = volgendeVertrekken(data.departures, MAX);
        eerstvolgende.forEach(b => {
          const tijdStr = b.departure_time.slice(0, 5);
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${tijdStr}</td>
            <td>${b.line}</td>
            <td>${b.destination}</td>
          `;
          rijen.appendChild(tr);
        });
      } catch (e) {
        rijen.innerHTML = '<tr><td colspan="3">Kan bustijden niet ophalen</td></tr>';
      }
      schaalTekstIn();
    }

    function schaalTekstIn() {
      const tafels = document.querySelectorAll('table');
      let fontSize = window.innerHeight * 0.028;
      tafels.forEach(tafel => {
        tafel.style.fontSize = fontSize + 'px';
      });
    }

    updateTrein();
    updateBus();

    setInterval(updateTrein, 60 * 1000);
    setInterval(updateBus, 60 * 1000);

    window.addEventListener('resize', schaalTekstIn);
  </script>
</body>
</html>
