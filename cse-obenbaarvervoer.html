<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>CSE Vertrektijden</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    #wrapper {
      width: 100%;
      height: 100%;
      padding: 2vh 2vw;
      box-sizing: border-box;
      display: flex;
      gap: 2vw;
    }

    .kolom {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .titel {
      color: #0fb6ff;
      font-size: clamp(1.2rem, 3.2vh, 2.5rem);
      font-weight: 800;
      padding: 0.5vh 0;
      margin-bottom: 1vh;
      border-bottom: 3px solid #0fb6ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabel-container {
      flex: 1;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #000000;
      table-layout: fixed;
    }

    th {
      text-align: left;
      font-weight: 700;
      color: #0fb6ff;
      border-bottom: 2px solid #0fb6ff;
      padding: 0.8vh 0.4vw;
    }

    td {
      padding: 1vh 0.4vw;
      border-bottom: 1px solid rgba(15, 182, 255, 0.25);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-tijd { width: 22%; }
    .col-lijn { width: 18%; }
    .col-bestemming { width: 60%; }
    .col-spoor { width: 18%; }

    .vertraagd {
      color: #ff5050;
      font-weight: 800;
    }

    .buiten-dienst {
      color: #777;
      font-style: italic;
      white-space: normal;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div class="kolom">
      <div class="titel">🚆 Treinstation: Zwolle Centraal</div>
      <div class="tabel-container" id="container-trein">
        <table>
          <thead>
            <tr>
              <th class="col-tijd">Tijd</th>
              <th class="col-bestemming">Bestemming</th>
              <th class="col-spoor">Spoor</th>
            </tr>
          </thead>
          <tbody id="rijen-trein">
            <tr><td colspan="3">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="kolom">
      <div class="titel">🚌 Busstation: Stadionplein</div>
      <div class="tabel-container" id="container-bus">
        <table>
          <thead>
            <tr>
              <th class="col-tijd">Tijd</th>
              <th class="col-lijn">Lijn</th>
              <th class="col-bestemming">Bestemming</th>
            </tr>
          </thead>
          <tbody id="rijen-bus">
            <tr><td colspan="3">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let treinData = null;
    let busData = null;

    function isBinnenBedrijfstijd() {
      const nu = new Date();
      const dag = nu.getDay(); // 1 = Ma, ..., 5 = Vr
      const uur = nu.getHours();
      return (dag >= 1 && dag <= 5) && (uur >= 8 && uur < 17);
    }

    function berekenAantalRijen() {
      const container = document.getElementById('container-trein');
      const containerHoogte = container.clientHeight;
      const rijHoogte = Math.max(35, window.innerHeight * 0.052); 
      const thHoogte = Math.max(30, window.innerHeight * 0.045);
      const beschikbareRuimte = containerHoogte - thHoogte;
      return Math.max(3, Math.floor(beschikbareRuimte / rijHoogte));
    }

    async function haalDataOp() {
      if (!isBinnenBedrijfstijd()) {
        toonBuitenDienst();
        return;
      }

      const timestamp = new Date().getTime();
      try {
        const [resTrein, resBus] = await Promise.all([
          fetch(`./trein.json?v=${timestamp}`, { cache: 'no-cache' }),
          fetch(`./bus.json?v=${timestamp}`, { cache: 'no-cache' })
        ]);

        if (resTrein.ok) {
          const raw = await resTrein.json();
          // Uitpakken van alle mogelijke structuren
          if (Array.isArray(raw)) treinData = raw;
          else if (raw.departures) treinData = raw.departures;
          else if (raw.payload && raw.payload.departures) treinData = raw.payload.departures;
          else treinData = [];
        }

        if (resBus.ok) {
          const raw = await resBus.json();
          busData = raw.departures || raw;
        }

        renderTafels();
      } catch (e) {
        console.error("Fout bij ophalen data:", e);
      }
    }

    function toonBuitenDienst() {
      const msg = '<tr><td colspan="3" class="buiten-dienst">Vertrektijden alleen beschikbaar op werkdagen van 08:00 tot 17:00</td></tr>';
      document.getElementById('rijen-trein').innerHTML = msg;
      document.getElementById('rijen-bus').innerHTML = msg;
    }

    function renderTafels() {
      if (!isBinnenBedrijfstijd()) return;

      const maxRijen = berekenAantalRijen();
      schaalTekstIn();

      const nu = new Date();
      const huidigUurMin = String(nu.getHours()).padStart(2, '0') + ":" + String(nu.getMinutes()).padStart(2, '0');

      // --- Treinen ---
      const rijenTrein = document.getElementById('rijen-trein');
      rijenTrein.innerHTML = '';

      if (Array.isArray(treinData) && treinData.length > 0) {
        // Welke vertrekken zijn nu of in de toekomst (op HH:MM basis)
        const geldigeTreinen = treinData.map(v => {
          const plannedStr = v.plannedDateTime || v.plannedDepartureTime;
          const actualStr = v.actualDateTime || v.plannedDepartureTime;
          const d = new Date(actualStr || plannedStr);
          const hhmm = String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0');
          return { original: v, hhmm: hhmm, dateObj: d };
        })
        .filter(t => t.hhmm >= huidigUurMin)
        .sort((a, b) => a.dateObj - b.dateObj);

        if (geldigeTreinen.length > 0) {
          geldigeTreinen.slice(0, maxRijen).forEach(item => {
            const v = item.original;
            const plannedStr = v.plannedDateTime || v.plannedDepartureTime;
            const actualStr = v.actualDateTime || v.plannedDepartureTime;
            const vertraagd = actualStr && plannedStr && (new Date(actualStr) > new Date(plannedStr));
            
            const bestemming = v.direction || v.destination || (v.destinationDetail && v.destinationDetail.main) || '-';
            const spoor = v.actualTrack || (v.plannedTrackInfo && v.plannedTrackInfo.actualTrack) || v.plannedTrack || '-';

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="col-tijd ${vertraagd ? 'vertraagd' : ''}">${item.hhmm}</td>
              <td class="col-bestemming" title="${bestemming}">${bestemming}</td>
              <td class="col-spoor">${spoor}</td>
            `;
            rijenTrein.appendChild(tr);
          });
        } else {
          rijenTrein.innerHTML = '<tr><td colspan="3">Geen komende treinen voor vandaag</td></tr>';
        }
      } else {
        rijenTrein.innerHTML = '<tr><td colspan="3">Geen actuele treingegevens geladen</td></tr>';
      }

      // --- Bussen ---
      const rijenBus = document.getElementById('rijen-bus');
      rijenBus.innerHTML = '';

      if (Array.isArray(busData) && busData.length > 0) {
        const sec = String(nu.getSeconds()).padStart(2, '0');
        const nuStr = `${huidigUurMin}:${sec}`;

        const komendeBussen = busData.filter(d => d.departure_time >= nuStr);

        const gezien = new Set();
        const uniek = [];
        for (const d of komendeBussen) {
          const sleutel = d.departure_time + '|' + d.line + '|' + d.destination;
          if (!gezien.has(sleutel)) {
            gezien.add(sleutel);
            uniek.push(d);
          }
        }

        if (uniek.length > 0) {
          uniek.slice(0, maxRijen).forEach(b => {
            const tijdStr = b.departure_time.slice(0, 5);
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="col-tijd">${tijdStr}</td>
              <td class="col-lijn">${b.line}</td>
              <td class="col-bestemming" title="${b.destination}">${b.destination}</td>
            `;
            rijenBus.appendChild(tr);
          });
        } else {
          rijenBus.innerHTML = '<tr><td colspan="3">Geen komende bussen voor vandaag</td></tr>';
        }
      } else {
        rijenBus.innerHTML = '<tr><td colspan="3">Kan bustijden niet ophalen</td></tr>';
      }
    }

    function schaalTekstIn() {
      const tafels = document.querySelectorAll('table');
      const berekendeGrootte = Math.min(window.innerHeight * 0.027, window.innerWidth * 0.015);
      const fontSize = Math.max(14, berekendeGrootte);
      tafels.forEach(tafel => tafel.style.fontSize = fontSize + 'px');
    }

    haalDataOp();
    setInterval(haalDataOp, 30 * 1000);
    setInterval(renderTafels, 10 * 1000);
    window.addEventListener('resize', renderTafels);
  </script>
</body>
</html>
