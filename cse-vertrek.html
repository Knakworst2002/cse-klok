<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>CSE Vertrektijden</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #wrapper {
    display: flex;
    gap: 1.5em;
    padding: 0.3em 0.6em;
  }
  .kolom {
    flex: 1;
  }
  .titel {
    color: #0fb6ff;
    font-size: 1.6vw;
    font-weight: 700;
    padding: 0.2em 0 0.1em 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 1.3vw;
    color: #0fb6ff;
  }
  th {
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #0fb6ff;
    padding: 0.2em 0.4em;
  }
  td {
    padding: 0.25em 0.4em;
    border-bottom: 1px solid rgba(15,182,255,0.25);
  }
  .vertraagd {
    color: #ff5050;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="kolom">
      <div class="titel">🚆 Trein — Zwolle</div>
      <table>
        <thead><tr><th>Tijd</th><th>Bestemming</th><th>Spoor</th></tr></thead>
        <tbody id="rijen-trein"><tr><td colspan="3">Laden...</td></tr></tbody>
      </table>
    </div>
    <div class="kolom">
      <div class="titel">🚌 Bus — Stadion</div>
      <table>
        <thead><tr><th>Tijd</th><th>Lijn</th><th>Bestemming</th></tr></thead>
        <tbody id="rijen-bus"><tr><td colspan="3">Laden...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    const MAX = 6;

    // --- NS treinen (uit departures.json, zelfde repo) ---
    async function updateTrein() {
      try {
        const res = await fetch('./departures.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const rijen = document.getElementById('rijen-trein');
        rijen.innerHTML = '';
        data.payload.departures.slice(0, MAX).forEach(v => {
          const tijd = new Date(v.actualDateTime || v.plannedDateTime);
          const tijdStr = tijd.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          const vertraagd = v.actualDateTime && v.actualDateTime !== v.plannedDateTime;
          const spoor = v.actualTrack || v.plannedTrack || '-';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="${vertraagd ? 'vertraagd' : ''}">${tijdStr}</td>
            <td>${v.direction}</td>
            <td>${spoor}</td>
          `;
          rijen.appendChild(tr);
        });
      } catch (e) {
        document.getElementById('rijen-trein').innerHTML = '<tr><td colspan="3">Kan treintijden niet ophalen</td></tr>';
      }
    }

    // --- Bussen (uit buses.json, zelfde repo) ---
    function volgendeVertrekken(departures, aantal) {
      const nu = new Date();
      const nuStr = nu.toTimeString().slice(0, 8); // HH:MM:SS
      const komend = departures.filter(d => d.departure_time >= nuStr);
      const bron = komend.length ? komend : departures;

      // Dedupliceren: zelfde tijd+lijn+bestemming (verschillende trip_id's) telt als 1 vertrek
      const gezien = new Set();
      const uniek = [];
      for (const d of bron) {
        const sleutel = d.departure_time + '|' + d.line + '|' + d.destination;
        if (!gezien.has(sleutel)) {
          gezien.add(sleutel);
          uniek.push(d);
        }
      }
      return uniek.slice(0, aantal);
    }

    async function updateBus() {
      try {
        const res = await fetch('./buses.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const rijen = document.getElementById('rijen-bus');
        rijen.innerHTML = '';
        const eerstvolgende = volgendeVertrekken(data.departures, MAX);
        eerstvolgende.forEach(b => {
          const tijdStr = b.departure_time.slice(0, 5); // HH:MM
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${tijdStr}</td>
            <td>${b.line}</td>
            <td>${b.destination}</td>
          `;
          rijen.appendChild(tr);
        });
      } catch (e) {
        document.getElementById('rijen-bus').innerHTML = '<tr><td colspan="3">Kan bustijden niet ophalen</td></tr>';
      }
    }

    updateTrein();
    updateBus();
    setInterval(updateTrein, 60 * 1000);
    setInterval(updateBus, 60 * 1000);
  </script>
</body>
</html>
