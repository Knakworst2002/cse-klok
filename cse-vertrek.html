<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSE OV Vertrektijden</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  body {
    color: #0fb6ff;
  }

  .container {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 0.5vw;
  }

  .header {
    font-size: 1.8vw;
    font-weight: 700;
    padding: 0.2em 0.3em 0.4em 0.3em;
  }

  .columns {
    display: flex;
    width: 100%;
    gap: 1.2vw;
  }

  .column {
    width: 50%;
  }

  .section-title {
    font-size: 1.35vw;
    font-weight: 700;
    padding: 0.35em 0.5em;
    border-bottom: 2px solid #0fb6ff;
  }

  .section-info {
    font-size: 0.75vw;
    opacity: 0.65;
    padding: 0.25em 0.7em 0.45em 0.7em;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 1.05vw;
  }

  th {
    text-align: left;
    font-weight: 600;
    padding: 0.25em 0.5em;
    border-bottom: 1px solid rgba(15, 182, 255, 0.5);
  }

  td {
    padding: 0.28em 0.5em;
    border-bottom: 1px solid rgba(15, 182, 255, 0.2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  th:nth-child(1),
  td:nth-child(1) {
    width: 22%;
  }

  th:nth-child(2),
  td:nth-child(2) {
    width: 53%;
  }

  th:nth-child(3),
  td:nth-child(3) {
    width: 25%;
  }

  .tijd {
    font-weight: 700;
  }

  .vertraagd {
    color: #ff5050;
    font-weight: 700;
  }

  .geannuleerd {
    color: #ff5050;
    font-weight: 700;
    text-decoration: line-through;
  }

  .buslijn {
    font-weight: 700;
  }

  .laden {
    opacity: 0.7;
    padding: 0.8em;
  }

  .fout {
    color: #ff5050;
    padding: 0.8em;
  }

  .footer {
    font-size: 0.65vw;
    opacity: 0.5;
    padding: 0.6em;
    text-align: right;
  }
</style>

</head>

<body>

<div class="container">

  <div class="header">
    🚆🚌 OV bij CSE
  </div>

  <div class="columns">

    <!-- TREINEN -->

    <div class="column">

      <div class="section-title">
        🚆 Treinen — Zwolle
      </div>

      <div class="section-info" id="treinStatus">
        Laden...
      </div>

      <table>

        <thead>
          <tr>
            <th>Tijd</th>
            <th>Bestemming</th>
            <th>Spoor</th>
          </tr>
        </thead>

        <tbody id="treinen">

          <tr>
            <td colspan="3" class="laden">
              Treinen laden...
            </td>
          </tr>

        </tbody>

      </table>

    </div>


    <!-- BUSSEN -->

    <div class="column">

      <div class="section-title">
        🚌 Bussen — Stadion
      </div>

      <div class="section-info" id="busStatus">
        Laden...
      </div>

      <table>

        <thead>
          <tr>
            <th>Tijd</th>
            <th>Lijn</th>
            <th>Richting</th>
          </tr>
        </thead>

        <tbody id="bussen">

          <tr>
            <td colspan="3" class="laden">
              Bussen laden...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

  <div class="footer" id="updateStatus">
    CSE OV
  </div>

</div>


<script>

/* =====================================================
   INSTELLINGEN
   ===================================================== */

const MAX_TREINEN = 6;
const MAX_BUSSEN = 6;


/* =====================================================
   TREINEN
   ===================================================== */

async function laadTreinen() {

  const container =
    document.getElementById("treinen");

  const status =
    document.getElementById("treinStatus");

  try {

    const response = await fetch(
      "departures.json?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "departures.json: " +
        response.status
      );
    }

    const data =
      await response.json();

    if (
      !data.payload ||
      !Array.isArray(
        data.payload.departures
      )
    ) {
      throw new Error(
        "Ongeldige NS-data"
      );
    }

    let vertrekken =
      data.payload.departures;


    /* Sorteer op geplande tijd */

    vertrekken.sort(function(a, b) {

      return new Date(
        a.plannedDateTime
      ) -
      new Date(
        b.plannedDateTime
      );

    });


    /* Alleen eerste 6 */

    vertrekken =
      vertrekken.slice(
        0,
        MAX_TREINEN
      );


    container.innerHTML = "";


    vertrekken.forEach(function(trein) {

      const gepland =
        new Date(
          trein.plannedDateTime
        );

      const actueel =
        trein.actualDateTime
          ? new Date(
              trein.actualDateTime
            )
          : gepland;


      const tijd =
        actueel.toLocaleTimeString(
          "nl-NL",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      const vertraging =
        Math.round(
          (
            actueel - gepland
          ) / 60000
        );


      const spoor =
        trein.actualTrack ||
        trein.plannedTrack ||
        "-";


      let tijdClass =
        "tijd";


      if (
        vertraging > 0
      ) {
        tijdClass +=
          " vertraagd";
      }


      if (
        trein.cancelled
      ) {
        tijdClass +=
          " geannuleerd";
      }


      let bestemming =
        trein.direction ||
        "-";


      if (
        trein.cancelled
      ) {
        bestemming +=
          " (GEANNULEERD)";
      }


      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td class="${tijdClass}">
          ${tijd}
        </td>

        <td>
          ${bestemming}
        </td>

        <td>
          ${spoor}
        </td>

      `;


      container.appendChild(tr);

    });


    status.textContent =
      "Actuele NS-vertrektijden";


  }

  catch (error) {

    console.error(
      "Trein fout:",
      error
    );


    container.innerHTML = `

      <tr>
        <td colspan="3"
            class="fout">
          Treintijden niet beschikbaar
        </td>
      </tr>

    `;


    status.textContent =
      "NS tijdelijk niet beschikbaar";

  }

}


/* =====================================================
   BUSSEN
   ===================================================== */

async function laadBussen() {

  const container =
    document.getElementById("bussen");

  const status =
    document.getElementById("busStatus");


  try {

    const response = await fetch(
      "buses.json?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );


    if (!response.ok) {

      throw new Error(
        "buses.json: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.departures ||
      !Array.isArray(
        data.departures
      )
    ) {

      throw new Error(
        "Ongeldige busdata"
      );

    }


    /*
      De huidige buses.json bevat
      de geplande dienstregeling.
    */

    let vertrekken =
      data.departures;


    /*
      Sorteer op vertrektijd.
    */

    vertrekken.sort(function(a, b) {

      return (
        a.departure_time || ""
      ).localeCompare(
        b.departure_time || ""
      );

    });


    /*
      We tonen maximaal 6.
    */

    vertrekken =
      vertrekken.slice(
        0,
        MAX_BUSSEN
      );


    container.innerHTML = "";


    vertrekken.forEach(
      function(bus) {

        const tijd =
          bus.departure_time ||
          "--:--";


        const tr =
          document.createElement(
            "tr"
          );


        tr.innerHTML = `

          <td class="tijd">
            ${tijd.substring(0, 5)}
          </td>

          <td class="buslijn">
            Bus
          </td>

          <td>
            Stadion
          </td>

        `;


        container.appendChild(tr);

      }
    );


    status.textContent =
      "Geplande dienstregeling";


  }

  catch (error) {

    console.error(
      "Bus fout:",
      error
    );


    container.innerHTML = `

      <tr>
        <td colspan="3"
            class="fout">
          Bustijden niet beschikbaar
        </td>
      </tr>

    `;


    status.textContent =
      "Busgegevens tijdelijk niet beschikbaar";

  }

}


/* =====================================================
   ALLES LADEN
   ===================================================== */

async function updateAlles() {

  await laadTreinen();

  await laadBussen();


  const nu =
    new Date();


  const tijd =
    nu.toLocaleTimeString(
      "nl-NL",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  document.getElementById(
    "updateStatus"
  ).textContent =
    "CSE OV • bijgewerkt " +
    tijd;

}


/* Eerste keer */

updateAlles();


/*
  Iedere minuut opnieuw controleren.
*/

setInterval(
  updateAlles,
  60 * 1000
);

</script>

</body>
</html>
