<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE Vertrektijden Zwolle</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }

  body {
    color: #0fb6ff;
  }

  .container {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
  }

  .titel {
    font-size: 1.8vw;
    font-weight: 700;
    padding: 0.35em 0.6em 0.15em 0.6em;
  }

  .subtitel {
    font-size: 0.9vw;
    opacity: 0.7;
    padding: 0 1.1em 0.5em 1.1em;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 1.25vw;
  }

  th {
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #0fb6ff;
    padding: 0.25em 0.6em;
  }

  td {
    padding: 0.28em 0.6em;
    border-bottom: 1px solid rgba(15, 182, 255, 0.25);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  th:nth-child(1),
  td:nth-child(1) {
    width: 18%;
  }

  th:nth-child(2),
  td:nth-child(2) {
    width: 57%;
  }

  th:nth-child(3),
  td:nth-child(3) {
    width: 25%;
  }

  .tijd {
    font-weight: 700;
  }

  .vertraagd {
    color: #ff5050;
    font-weight: 700;
  }

  .op-tijd {
    color: #0fb6ff;
  }

  .geannuleerd {
    color: #ff5050;
    font-weight: 700;
    text-decoration: line-through;
  }

  .laden,
  .fout {
    padding: 0.8em;
    font-size: 1.2vw;
  }

  .fout {
    color: #ff5050;
  }
</style>
</head>

<body>

<div class="container">

  <div class="titel">🚆 Vertrek Zwolle</div>

  <div class="subtitel" id="status">
    Vertrektijden worden geladen...
  </div>

  <table>
    <thead>
      <tr>
        <th>Tijd</th>
        <th>Bestemming</th>
        <th>Spoor</th>
      </tr>
    </thead>

    <tbody id="rijen">
      <tr>
        <td colspan="3" class="laden">Laden...</td>
      </tr>
    </tbody>
  </table>

</div>

<script>

const MAX_TREINEN = 6;

async function updateVertrek() {

  const rijen = document.getElementById('rijen');
  const status = document.getElementById('status');

  try {

    /*
      De GitHub Action haalt de NS-data op.
      Deze pagina leest alleen departures.json.
    */

    const response = await fetch(
      'departures.json?t=' + Date.now(),
      {
        cache: 'no-store'
      }
    );

    if (!response.ok) {
      throw new Error(
        'departures.json kon niet worden geladen (' +
        response.status +
        ')'
      );
    }

    const data = await response.json();

    /*
      De NS-data staat in:
      payload.departures
    */

    if (
      !data.payload ||
      !Array.isArray(data.payload.departures)
    ) {
      throw new Error('Ongeldige NS-data');
    }

    const vertrekken = data.payload.departures;

    /*
      Sorteer op geplande vertrektijd.
    */

    vertrekken.sort(function(a, b) {

      return new Date(a.plannedDateTime) -
             new Date(b.plannedDateTime);

    });

    /*
      Alleen de eerstvolgende treinen tonen.
      Geannuleerde treinen mogen wel zichtbaar blijven.
    */

    const geselecteerd = vertrekken
      .slice(0, MAX_TREINEN);

    rijen.innerHTML = '';

    if (geselecteerd.length === 0) {

      rijen.innerHTML =
        '<tr><td colspan="3">Geen vertrektijden beschikbaar</td></tr>';

      return;
    }

    geselecteerd.forEach(function(trein) {

      const gepland = new Date(trein.plannedDateTime);

      const actueel = trein.actualDateTime
        ? new Date(trein.actualDateTime)
        : gepland;

      const tijd = actueel.toLocaleTimeString(
        'nl-NL',
        {
          hour: '2-digit',
          minute: '2-digit'
        }
      );

      const vertraging =
        Math.round(
          (actueel - gepland) / 60000
        );

      const vertraagd =
        vertraging > 0;

      const geannuleerd =
        trein.cancelled === true;

      const spoor =
        trein.actualTrack ||
        trein.plannedTrack ||
        '-';

      const bestemming =
        trein.direction ||
        '-';

      const tr =
        document.createElement('tr');

      /*
        Tijd
      */

      let tijdKlasse = 'tijd';

      if (vertraagd) {
        tijdKlasse += ' vertraagd';
      }

      if (geannuleerd) {
        tijdKlasse += ' geannuleerd';
      }

      /*
        Bestemming
      */

      let bestemmingTekst =
        bestemming;

      if (geannuleerd) {
        bestemmingTekst += ' (GEANNULEERD)';
      }

      /*
        HTML maken
      */

      tr.innerHTML = `
        <td class="${tijdKlasse}">
          ${tijd}
        </td>

        <td>
          ${bestemmingTekst}
        </td>

        <td>
          ${spoor}
        </td>
      `;

      rijen.appendChild(tr);

    });

    /*
      Status onder de titel
    */

    const nu = new Date();

    const updateTijd =
      nu.toLocaleTimeString(
        'nl-NL',
        {
          hour: '2-digit',
          minute: '2-digit'
        }
      );

    status.textContent =
      'Station Zwolle • bijgewerkt om ' +
      updateTijd;

  }

  catch (error) {

    console.error(
      'Fout bij ophalen vertrektijden:',
      error
    );

    rijen.innerHTML = `
      <tr>
        <td colspan="3" class="fout">
          Kan vertrektijden niet ophalen
        </td>
      </tr>
    `;

    status.textContent =
      'Kan NS-gegevens momenteel niet laden';

  }

}


/*
  Eerste keer direct laden
*/

updateVertrek();


/*
  Iedere minuut controleren of er
  nieuwe gegevens beschikbaar zijn.
*/

setInterval(
  updateVertrek,
  60 * 1000
);

</script>

</body>
</html>
