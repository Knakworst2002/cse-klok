name: Bus vertrektijden ophalen

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GTFS downloaden
        run: |
          curl -L "https://gtfs.ovapi.nl/nl/gtfs-nl.zip" -o gtfs.zip

      - name: Busgegevens maken
        run: |
          python - <<'PY'
          import zipfile
          import csv
          import json

          z = zipfile.ZipFile("gtfs.zip")

          # Halte zoeken
          stop_id = None
          stop_name = None

          with z.open("stops.txt") as f:
              rows = csv.DictReader(
                  line.decode("utf-8-sig")
                  for line in f
              )

              for row in rows:
                  naam = row.get("stop_name", "").lower()

                  if "stadion" in naam and "zwolle" in naam:
                      stop_id = row["stop_id"]
                      stop_name = row["stop_name"]
                      break

          if not stop_id:
              raise Exception("Zwolle, Stadion niet gevonden")

          print("HALTE:", stop_id, stop_name)

          # Routes
          routes = {}

          with z.open("routes.txt") as f:
              rows = csv.DictReader(
                  line.decode("utf-8-sig")
                  for line in f
              )

              for row in rows:
                  routes[row["route_id"]] = {
                      "line": row.get("route_short_name", ""),
                      "route": row.get("route_long_name", "")
                  }

          print("ROUTES:", len(routes))

          # Trips
          trips = {}

          with z.open("trips.txt") as f:
              rows = csv.DictReader(
                  line.decode("utf-8-sig")
                  for line in f
              )

              for row in rows:
                  trips[row["trip_id"]] = {
                      "route_id": row.get("route_id", ""),
                      "destination": row.get("trip_headsign", "")
                  }

          print("TRIPS:", len(trips))

          # Vertrektijden
          departures = []

          with z.open("stop_times.txt") as f:
              rows = csv.DictReader(
                  line.decode("utf-8-sig")
                  for line in f
              )

              for row in rows:

                  if row.get("stop_id") != stop_id:
                      continue

                  trip_id = row.get("trip_id", "")
                  trip = trips.get(trip_id, {})

                  route_id = trip.get("route_id", "")
                  route = routes.get(route_id, {})

                  departures.append({
                      "trip_id": trip_id,
                      "departure_time": row.get("departure_time", ""),
                      "line": route.get("line", ""),
                      "route": route.get("route", ""),
                      "destination": trip.get("destination", "")
                  })

          departures.sort(
              key=lambda x: x["departure_time"]
          )

          data = {
              "stop_id": stop_id,
              "stop_name": stop_name,
              ""departures": departures
          }

          with open("buses.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("BUSRITTEN:", len(departures))

          for bus in departures[:10]:
              print(
                  bus["departure_time"],
                  "| lijn:",
                  bus["line"],
                  "| bestemming:",
                  bus["destination"]
              )

          PY

      - name: buses.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add buses.json

          git commit -m "Update bus vertrektijden" || echo "Geen wijzigingen"

          git push
