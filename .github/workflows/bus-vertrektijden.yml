name: Bus vertrektijden ophalen

on:
  schedule:
    - cron: "*/5 6-15 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Python instellen
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install requests

      - name: Bustijden ophalen via NDOV API
        run: |
          python - <<'PY'
          import requests
          import json
          from datetime import datetime

          # Haltecode voor Zwolle, Stadionplein
          HALTE_CODE = "NL:S:zwostp"
          url = f"https://api.v2.ndovloket.nl/departures/stoparea/{HALTE_CODE}"

          try:
              response = requests.get(url, timeout=15)
              if response.status_code == 200:
                  raw_data = response.json()
                  
                  vertrekken = []
                  # Verwerk de binnenkomende NDOV data
                  for item in raw_data.get("departures", raw_data if isinstance(raw_data, list) else []):
                      tijd_str = item.get("expected_departure_time") or item.get("departure_time") or item.get("planned_departure_time")
                      lijn = str(item.get("line_number") or item.get("line") or "")
                      bestemming = item.get("destination") or item.get("target_name") or ""

                      if tijd_str and lijn and bestemming:
                          # Format de tijd naar HH:MM:SS
                          if "T" in tijd_str:
                              tijd_formatted = tijd_str.split("T")[1][:8]
                          else:
                              tijd_formatted = tijd_str[:8]

                          vertrekken.append({
                              "departure_time": tijd_formatted,
                              "line": lijn,
                              "destination": bestemming
                          })

                  # Sorteer op vertrektijd
                  vertrekken.sort(key=lambda x: x["departure_time"])

                  with open("bus.json", "w", encoding="utf-8") as f:
                      json.dump(vertrekken, f, ensure_ascii=False, indent=2)
                  print(f"Succesvol {len(vertrekken)} busvertrekken opgeslagen in bus.json!")
              else:
                  print(f"HTTP Fout {response.status_code} bij ophalen bustijden.")
          except Exception as e:
              print(f"Fout bij ophalen busdata: {e}")
          PY

      - name: bus.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bus.json
          git commit -m "Update bus.json [skip ci]" || echo "Geen wijzigingen"
          git push
