name: Bus vertrektijden ophalen

on:
  schedule:
    - cron: "*/5 6-15 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Python instellen
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install requests

      - name: Bustijden ophalen via OpenOV
        run: |
          python - <<'PY'
          import requests
          import json

          # Zoek op halte Stadionplein, Zwolle
          url = "https://v0.ovapi.nl/stopareacode/zwostp"

          try:
              res = requests.get(url, timeout=15)
              if res.status_code == 200:
                  raw = res.json()
                  
                  vertrekken = []
                  # De OVAPI retourneert data per timingpoint/perron
                  for stop_code, data in raw.get("zwostp", {}).items():
                      passes = data.get("Passes", {})
                      for pass_id, bus in passes.items():
                          tijd = bus.get("TargetDepartureTime") or bus.get("ExpectedDepartureTime")
                          lijn = bus.get("LinePlanningNumber") or bus.get("LinePublicNumber")
                          bestemming = bus.get("DestinationName50") or bus.get("TargetName")
                          
                          if tijd and lijn and bestemming:
                              # Tijd formatteren naar HH:MM
                              if "T" in tijd:
                                  tijd_clean = tijd.split("T")[1][:5]
                              else:
                                  tijd_clean = tijd[:5]

                              vertrekken.append({
                                  "departure_time": tijd_clean,
                                  "line": str(lijn),
                                  "destination": str(bestemming)
                              })

                  # Sorteer op tijd
                  vertrekken.sort(key=lambda x: x["departure_time"])

                  # Verwijder dubbele vermeldingen
                  uniek = []
                  gezien = set()
                  for v in vertrekken:
                      key = f"{v['departure_time']}-{v['line']}-{v['destination']}"
                      if key not in gezien:
                          gezien.add(key)
                          uniek.append(v)

                  with open("bus.json", "w", encoding="utf-8") as f:
                      json.dump(uniek, f, ensure_ascii=False, indent=2)
                  
                  print(f"Succes! {len(uniek)} ritten opgeslagen in bus.json")
              else:
                  print(f"Foutmelding HTTP {res.status_code}")
          except Exception as e:
              print(f"Fout: {e}")
          PY

      - name: bus.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bus.json
          git commit -m "Update bus.json met live data [skip ci]" || echo "Geen wijzigingen"
          git push
