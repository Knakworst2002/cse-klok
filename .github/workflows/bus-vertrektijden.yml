name: Bus vertrektijden ophalen

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GTFS downloaden
        run: |
          curl -L \
            "https://gtfs.ovapi.nl/nl/gtfs-nl.zip" \
            -o gtfs.zip

      - name: Halte Zwolle Stadion zoeken
        run: |
          python - <<'PY'
          import zipfile
          import csv

          with zipfile.ZipFile("gtfs.zip") as z:
              with z.open("stops.txt") as f:
                  rows = csv.DictReader(
                      (line.decode("utf-8-sig") for line in f)
                  )

                  gevonden = []

                  for row in rows:
                      naam = row.get("stop_name", "").lower()

                      if (
                          "stadion" in naam
                          and "zwolle" in naam
                      ):
                          gevonden.append(row)

                  print("Gevonden haltes:")

                  for row in gevonden:
                      print(
                          row.get("stop_id"),
                          row.get("stop_name")
                      )

                  if not gevonden:
                      raise SystemExit(
                          "Halte Zwolle, Stadion niet gevonden"
                      )

                  with open("stadion_stop.txt", "w") as out:
                      out.write(
                          gevonden[0].get("stop_id", "")
                      )
          PY

      - name: Stop-ID tonen
        run: |
          echo "Stop-ID:"
          cat stadion_stop.txt

      - name: Busdata voorbereiden
        run: |
          python - <<'PY'
          import json
          import zipfile
          import csv
          from datetime import datetime, timezone

          stop_id = open("stadion_stop.txt").read().strip()

          print("Gekozen stop:", stop_id)

          data = {
              "stop_id": stop_id,
              "stop_name": "Zwolle, Stadion",
              "departures": [],
              "updated": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          with zipfile.ZipFile("gtfs.zip") as z:

              # Alleen dienstregeling-data lezen.
              # Realtime-data voegen we in een volgende stap toe.
              with z.open("stop_times.txt") as f:

                  rows = csv.DictReader(
                      (line.decode("utf-8-sig") for line in f)
                  )

                  aantal = 0

                  for row in rows:

                      if row.get("stop_id") != stop_id:
                          continue

                      data["departures"].append({
                          "trip_id": row.get("trip_id"),
                          "arrival_time": row.get(
                              "arrival_time"
                          ),
                          "departure_time": row.get(
                              "departure_time"
                          ),
                          "stop_sequence": row.get(
                              "stop_sequence"
                          )
                      })

                      aantal += 1

                      if aantal >= 100:
                          break

          with open(
              "buses.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Aantal gevonden busritten:",
              len(data["departures"])
          )
          PY

      - name: buses.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add buses.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Update bus vertrektijden"
            git push
          fi
