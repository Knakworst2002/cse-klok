name: Trein vertrektijden ophalen

on:
  schedule:
    - cron: "*/5 6-15 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Python instellen
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install requests urllib3

      - name: Treingegevens ophalen van NS API
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
        run: |
          python - <<'PY'
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          import os
          import json
          import time

          api_key = os.environ.get("NS_API_KEY", "").strip()

          if not api_key:
              print("ERROR: Secret 'NS_API_KEY' ontbreekt in GitHub Repository Settings!")
              exit(1)

          url = "https://gateway.api.ns.nl/reisinformatie-api/api/v2/departures"
          params = {
              "station": "ZL",
              "maxJourneys": "30"
          }
          headers = {
              "Ocp-Apim-Subscription-Key": api_key,
              "User-Agent": "Mozilla/5.0"
          }

          # Sessie met automatische retries bij netwerk- of DNS-problemen
          session = requests.Session()
          retries = Retry(
              total=5,
              backoff_factor=2,
              status_forcelist=[500, 502, 503, 504],
              raise_on_status=False
          )
          session.mount("https://", HTTPAdapter(max_retries=retries))

          success = False
          for poging in range(1, 4):
              try:
                  print(f"Poging {poging} om NS API te bereiken...")
                  response = session.get(url, headers=headers, params=params, timeout=15)
                  
                  if response.status_code == 200:
                      data = response.json()
                      with open("trein.json", "w", encoding="utf-8") as f:
                          json.dump(data, f, ensure_ascii=False, indent=2)
                      print("Treingegevens succesvol vernieuwd!")
                      success = True
                      break
                  else:
                      print(f"HTTP Fout {response.status_code}: {response.text}")
              except Exception as e:
                  print(f"Netwerkfout bij poging {poging}: {e}")
              
              time.sleep(3)

          if not success:
              print("ERROR: Verbinding met NS API kon na meerdere pogingen niet worden hersteld.")
              exit(1)
          PY

      - name: trein.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trein.json
          git commit -m "Update trein.json [skip ci]" || echo "Geen wijzigingen"
          git push
