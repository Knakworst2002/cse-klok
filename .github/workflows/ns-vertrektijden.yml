name: Trein vertrektijden ophalen

on:
  schedule:
    # Draait van ma t/m vr om de 5 minuten tussen 08:00 en 17:00 NL tijd (06:00-15:00 UTC)
    - cron: "*/5 6-15 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Treingegevens ophalen van NS API
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
        run: |
          python - <<'PY'
          import urllib.request
          import os
          import json
          import time

          url = "https://gateway.api.ns.nl/reisinformatie-api/api/v2/departures?station=ZL&maxJourneys=25"
          api_key = os.environ.get("NS_API_KEY", "")

          req = urllib.request.Request(url, headers={
              "Ocp-Apim-Subscription-Key": api_key,
              "User-Agent": "Mozilla/5.0"
          })

          # Probeer 3 keer bij netwerk- of DNS-problemen
          for poging in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.loads(response.read().decode())
                      with open("trein.json", "w", encoding="utf-8") as f:
                          json.dump(data, f, ensure_ascii=False, indent=2)
                      print("Treingegevens succesvol opgehaald!")
                      break
              except Exception as e:
                  print(f"Poging {poging + 1} mislukt: {e}")
                  if poging < 2:
                      time.sleep(3)
                  else:
                      raise e
          PY

      - name: trein.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trein.json
          git commit -m "Update trein vertrektijden" || echo "Geen wijzigingen"
          git push
