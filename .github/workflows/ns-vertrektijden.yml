name: NS vertrektijden ophalen

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: NS vertrektijden ophalen
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
        run: |
          curl -s \
            -H "Ocp-Apim-Subscription-Key: $NS_API_KEY" \
            "https://gateway.apiportal.ns.nl/reisinformatie-api/api/v2/departures?station=Zwolle&maxJourneys=6" \
            -o departures.json

      - name: departures.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departures.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Update NS vertrektijden"
            git push
          fi
