name: Trein vertrektijden ophalen

on:
  schedule:
    - cron: "*/5 6-15 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Python instellen
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install requests

      - name: Treingegevens ophalen van NS API
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
        run: |
          python - <<'PY'
          import requests
          import os
          import json

          api_key = os.environ.get("NS_API_KEY", "").strip()

          if not api_key:
              print("ERROR: Secret 'NS_API_KEY' ontbreekt in GitHub Repository Settings!")
              exit(1)

          # Juiste domeinnaam voor de NS API
          url = "https://api.ns.nl/reisinformatie-api/api/v2/departures"
          params = {
              "station": "ZL",
              "maxJourneys": "30"
          }
          headers = {
              "Ocp-Apim-Subscription-Key": api_key,
              "User-Agent": "Mozilla/5.0"
          }

          try:
              response = requests.get(url, headers=headers, params=params, timeout=15)
              
              if response.status_code == 200:
                  data = response.json()
                  with open("trein.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  print("Treingegevens succesvol vernieuwd!")
              else:
                  print(f"HTTP Fout {response.status_code}: {response.text}")
                  if response.status_code in [401, 403]:
                      print("API key geweigerd. Controleer of de sleutel klopt in GitHub Secrets.")
                  exit(1)
          except Exception as e:
              print(f"Fout tijdens ophalen: {e}")
              exit(1)
          PY

      - name: trein.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trein.json
          git commit -m "Update trein.json [skip ci]" || echo "Geen wijzigingen"
          git push
