<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Ouderavond Lokaalindeling</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1877px;
      height: 1211px;
      background: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    #wrapper {
      width: 100%;
      height: 100%;
      padding: 40px 60px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    #titel-header {
      color: #0fb6ff;
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 20px;
      text-transform: capitalize;
      flex-shrink: 0;
    }

    #tabel-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      overflow: hidden;
    }

    .tabel-rij {
      display: grid;
      grid-template-columns: 1.2fr 3fr 1fr;
      align-items: center;
      border-bottom: 2px solid rgba(0, 0, 0, 0.1);
      padding: 6px 16px;
      font-weight: 600;
    }

    .tabel-header-rij {
      border-bottom: 4px solid #0fb6ff;
      font-weight: 800;
      color: #0fb6ff;
    }

    .sectie-header {
      background-color: #f0f8ff;
      color: #0fb6ff;
      font-weight: 800;
      padding: 8px 16px;
      margin-top: 10px;
      border-left: 6px solid #0fb6ff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .col-klas {
      color: #000000;
    }

    .col-collega {
      color: #333333;
    }

    .col-lokaal {
      color: #0fb6ff;
      text-align: right;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div id="wrapper">
  <div id="titel-header">Ouderavond - Lokaalindeling</div>
  
  <div id="tabel-container">
    <div class="tabel-rij tabel-header-rij">
      <div class="col-klas">Klas</div>
      <div class="col-collega">Collega</div>
      <div class="col-lokaal">Lokaal</div>
    </div>
    <div id="data-rijen"></div>
  </div>
</div>

<script>
// =========================================================================
// GEGEVENSVOORBEELD / CONFIGURATIE PER OUDERAVOND
// In de toekomst kun je hier eenvoudig extra avonden/dagen toevoegen!
// =========================================================================
const ouderavonden = {
  // Avond 1 (standaard)
  "1": {
    titel: "Ouderavond Leerjaar 2 & 3",
    data: [
      { klas: "2BK", collega: "Mariana", lokaal: "1" },
      { klas: "2TL", collega: "George & Tamme", lokaal: "7" },
      { klas: "2Hb", collega: "Ferry", lokaal: "4" },
      { klas: "2Ha", collega: "Annemieke", lokaal: "5" },
      { klas: "2V", collega: "Jasmijn", lokaal: "6" },
      { klas: "3BK", collega: "Hans", lokaal: "9a" },
      { klas: "3TLb", collega: "Joleen", lokaal: "2" },
      { klas: "3TLa", collega: "Rudi", lokaal: "3" },
      { klas: "3Ha", collega: "Allard", lokaal: "8" },
      { klas: "3Hb", collega: "Meyke", lokaal: "9b" },
      { klas: "3V", collega: "Mieke", lokaal: "12" }
    ]
  },
  
  // Avond 2 (Voorbeeld voor een volgende keer)
  "2": {
    titel: "Ouderavond Leerjaar 1, 4, 5 & 6",
    data: [
      { klas: "1BK", collega: "Jan", lokaal: "1" },
      { klas: "1THa", collega: "Karin", lokaal: "2" },
      { klas: "4V", collega: "Peter", lokaal: "10" },
      { klas: "5V", collega: "Sanne", lokaal: "11" }
    ]
  }
};

// Functie die op basis van de klas-naam bepaalt op welke verdieping de klas zit
function bepaalVerdieping(klas) {
  // Voorbeeldregels op basis van klasnaam:
  // Klas 1 en 2 op Begane grond, klas 3 t/m 6 op de 1e Verdieping
  if (klas.startsWith("1") || klas.startsWith("2")) {
    return "Begane grond";
  }
  return "1e Verdieping (Boven)";
}

function laadOuderavond() {
  const params = new URLSearchParams(window.location.search);
  
  // Lees de gekozen avond uit de URL param ?avond=1 of ?avond=2 (standaard is "1")
  const gekozenAvondKey = params.get("avond") || "1";
  const actieveAvond = ouderavonden[gekozenAvondKey] || ouderavonden["1"];

  // Stel de titel in
  document.getElementById("titel-header").textContent = actieveAvond.titel;

  const container = document.getElementById("data-rijen");
  container.innerHTML = "";

  // Sorteer/Koppel verdiepingen op basis van de klas
  const verwerkteData = actieveAvond.data.map(item => ({
    ...item,
    verdieping: bepaalVerdieping(item.klas)
  }));

  let huidigeVerdieping = "";

  verwerkteData.forEach(item => {
    // Tussenkop toevoegen zodra van verdieping gewisseld wordt
    if (item.verdieping !== huidigeVerdieping) {
      huidigeVerdieping = item.verdieping;
      const headerDiv = document.createElement("div");
      headerDiv.className = "sectie-header";
      headerDiv.textContent = huidigeVerdieping;
      container.appendChild(headerDiv);
    }

    const div = document.createElement("div");
    div.className = "tabel-rij";
    div.innerHTML = `
      <div class="col-klas">${item.klas}</div>
      <div class="col-collega">${item.collega}</div>
      <div class="col-lokaal">${item.lokaal}</div>
    `;
    container.appendChild(div);
  });

  schaalTekstIn();
}

// Automatische lettergrootte berekening
function schaalTekstIn() {
  const container = document.getElementById("tabel-container");
  let fontSize = 48; // Maximale startgrootte

  container.style.fontSize = fontSize + "px";

  // Verlaag de lettergrootte zolang de inhoud buiten de 1211px hoogte valt
  while (container.scrollHeight > container.clientHeight && fontSize > 14) {
    fontSize -= 1;
    container.style.fontSize = fontSize + "px";
  }
}

laadOuderavond();
window.addEventListener("resize", schaalTekstIn);
</script>

</body>
</html>
