<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>CSE Corvee Vandaag</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    #wrapper {
      padding: 2vh 2.5vh;
      box-sizing: border-box;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #datum-boven {
      color: #0fb6ff;
      font-size: 4.2vh;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 0.3vh;
    }

    #titel {
      color: #0fb6ff;
      font-size: 2.2vh;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1vh;
    }

    #klassen {
      display: flex;
      flex-direction: column;
      gap: 0.4vh;
    }

    .klas {
      color: #000000;
      font-size: 3.2vh;
      font-weight: 600;
      padding: 0.25em 0.5em;
      border-bottom: 1px solid rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>

<div id="wrapper">
  <div id="datum-boven">--</div>
  <div id="titel">--</div>
  <div id="klassen"></div>
</div>

<script>
  const corvee = {
    1: ["6V", "5V", "5Hb", "5Ha", "4V"],
    2: ["4Hb", "4Ha", "4TL", "4BK", "3V"],
    3: ["3Hb", "3Ha", "3TLb", "3TLa", "3BK"],
    4: ["2V", "2Hb", "2Ha", "2TL", "2BK"],
    5: ["1HVb", "1Hva", "1THb", "1THa", "1BK"]
  };

  function getVandaag() {
    const params = new URLSearchParams(window.location.search);
    const override = params.get("datum");

    if (override) {
      return new Date(override + "T00:00:00");
    }

    return new Date(
      new Date().toLocaleString("en-US", {
        timeZone: "Europe/Amsterdam"
      })
    );
  }

  function formatteerDatum(datum) {
    return new Intl.DateTimeFormat("nl-NL", {
      weekday: "long",
      day: "numeric",
      month: "long"
    }).format(datum);
  }

  function update() {
    let datum = getVandaag();
    let dag = datum.getDay();

    // Weekend: vrijdag tonen
    if (dag === 6) {
      datum.setDate(datum.getDate() - 1);
      dag = 5;
    }

    if (dag === 0) {
      datum.setDate(datum.getDate() - 2);
      dag = 5;
    }

    document.getElementById("datum-boven").textContent =
      "Vandaag, " + formatteerDatum(datum) + ", hebben corvee:";

    document.getElementById("titel").textContent =
      "De volgende klassen zijn aan de beurt:";

    const container = document.getElementById("klassen");
    container.innerHTML = "";

    if (!corvee[dag]) {
      document.getElementById("titel").textContent = "Geen corvee";
      return;
    }

    corvee[dag].forEach(klas => {
      const div = document.createElement("div");
      div.className = "klas";
      div.textContent = klas;
      container.appendChild(div);
    });
  }

  update();
  setInterval(update, 5 * 60 * 1000);
</script>

</body>
</html>
